        // =========================================================================
        const firebaseConfig = {
            databaseURL: "https://bap-pick-aa050-default-rtdb.asia-southeast1.firebasedatabase.app/" // <--- THAY ĐƯỜNG LINK CỦA BẠN VÀO ĐÂY
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        const normalizeStr = (str) => {
            return str ? str.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "") : "";
        };

        function PickApp() {
          const roundsConfig = [
            { round: 1, order: [1, 2, 3, 4, 5, 6, 7, 8], picks: 2 },
            { round: 2, order: [8, 1, 2, 3, 4, 5, 6, 7], picks: 3 },
            { round: 3, order: [7, 8, 1, 2, 3, 4, 5, 6], picks: 3 },
            { round: 4, order: [6, 7, 8, 1, 2, 3, 4, 5], picks: 3 },
            { round: 5, order: [5, 6, 7, 8, 1, 2, 3, 4], picks: 3 },
            { round: 6, order: [4, 5, 6, 7, 8, 1, 2, 3], picks: 3 },
            { round: 7, order: [3, 4, 5, 6, 7, 8, 1, 2], picks: 3 },
            { round: 8, order: [2, 3, 4, 5, 6, 7, 8, 1], picks: 3 }
          ];

          const urlParams = new URLSearchParams(window.location.search);
          const isViewer = urlParams.get('role') === 'viewer';
          const initRoom = urlParams.get('room') || 'phong-mac-dinh';

          const [roomCode, setRoomCode] = useState(initRoom);

          const [step, setStep] = useState(1);
          const [coaches, setCoaches] = useState(Array.from({ length: 8 }, (_, i) => ({ id: i + 1, name: `HLV ${i + 1}`, squad: [] })));
          
          const [restrictedRules, setRestrictedRules] = useState([
            { season: 'Legends', maxCount: 2 },
            { season: 'WCC', maxCount: 1 },
            { season: 'WC26', maxCount: 1 },
            { season: 'WCI', maxCount: 1 },
            { season: 'WK', maxCount: 1 }
          ]);
          const [newRuleSeason, setNewRuleSeason] = useState('');
          const [newRuleMax, setNewRuleMax] = useState(1);

          const [database, setDatabase] = useState([]);
          const [importText, setImportText] = useState("");
          const [singlePlayer, setSinglePlayer] = useState({ name: '', position: '', season: '' });
          
          const [searchQuery, setSearchQuery] = useState("");
          const [seasonFilter, setSeasonFilter] = useState("");
          const [toast, setToast] = useState(null);

          const [currentRound, setCurrentRound] = useState(0);
          const [currentTurnIndex, setCurrentTurnIndex] = useState(0);
          const [picksLeftInTurn, setPicksLeftInTurn] = useState(2); 
          const [pickStarted, setPickStarted] = useState(false);
          
          const [isSynced, setIsSynced] = useState(false);
          const [connectionError, setConnectionError] = useState(false);

          useEffect(() => {
              // Bắt đầu tính giờ kết nối, nếu quá 6 giây không phản hồi -> Báo lỗi
              const timeout = setTimeout(() => {
                  if (!isSynced) setConnectionError(true);
              }, 6000);

              try {
                  const roomRef = db.ref('rooms/' + roomCode);
                  roomRef.on('value', (snapshot) => {
                      const data = snapshot.val();
                      if (data) {
                          if (data.coaches) setCoaches(data.coaches);
                          if (data.restrictedRules) setRestrictedRules(data.restrictedRules);
                          if (data.database) setDatabase(data.database);
                          if (typeof data.currentRound === 'number') setCurrentRound(data.currentRound);
                          if (typeof data.currentTurnIndex === 'number') setCurrentTurnIndex(data.currentTurnIndex);
                          if (typeof data.picksLeftInTurn === 'number') setPicksLeftInTurn(data.picksLeftInTurn);
                          if (typeof data.pickStarted === 'boolean') setPickStarted(data.pickStarted);
                          if (typeof data.step === 'number') setStep(data.step);
                      }
                      setIsSynced(true);
                      setConnectionError(false);
                      clearTimeout(timeout);
                  }, (error) => {
                      console.error("Firebase Error:", error);
                      setConnectionError(true);
                  });
                  return () => roomRef.off();
              } catch (e) {
                  setConnectionError(true);
              }
          }, [roomCode]);

          const updateCloudState = (newState) => {
              if (isViewer) return; 
              try {
                  const roomRef = db.ref('rooms/' + roomCode);
                  roomRef.update(newState);
              } catch(e) {
                  showToast("Không thể đồng bộ với Server", "error");
              }
          };

          const showToast = (message, type = "error") => {
            setToast({ message, type });
            setTimeout(() => setToast(null), 3000);
          };

          const getPlayerKey = (p) => `${p.name.trim()}-${p.season.trim()}`.toLowerCase();
          
          const pickedPlayerKeys = [];
          coaches.forEach(c => {
            if (c.squad) {
              c.squad.forEach(p => {
                if (!p.isSkip) pickedPlayerKeys.push(getPlayerKey(p));
              });
            }
          });
          
          const getActiveCoachId = () => {
            if (roundsConfig[currentRound] && currentTurnIndex < roundsConfig[currentRound].order.length) {
              return roundsConfig[currentRound].order[currentTurnIndex];
            }
            return null;
          };
          const currentCoachId = getActiveCoachId();
          const activeCoach = coaches.find(c => c.id === currentCoachId);
          
          const currentCoachPlayerNames = activeCoach && activeCoach.squad ? activeCoach.squad.filter(p => !p.isSkip).map(p => normalizeStr(p.name)) : [];

          const getPlayerStatus = (p) => {
            if (pickedPlayerKeys.includes(getPlayerKey(p))) return 'PICKED_ANY'; 
            if (currentCoachPlayerNames.includes(normalizeStr(p.name))) return 'SAME_NAME_CURRENT_COACH'; 
            return 'AVAILABLE'; 
          };

          const availableSeasons = [...new Set(database.map(p => p.season.trim()))].filter(Boolean).sort();

          const q = normalizeStr(searchQuery);
          const sFilter = normalizeStr(seasonFilter);

          const filteredPlayers = database.filter(p => {
            const matchSearch = q === "" || 
                                normalizeStr(p.name).includes(q) || 
                                normalizeStr(p.position).includes(q) ||
                                normalizeStr(p.season).includes(q);
            const matchSeason = sFilter === "" || normalizeStr(p.season) === sFilter;
            return matchSearch && matchSeason;
          });

          filteredPlayers.sort((a, b) => {
            const sA = getPlayerStatus(a);
            const sB = getPlayerStatus(b);
            const getScore = (s) => (s === 'AVAILABLE' ? 0 : s === 'SAME_NAME_CURRENT_COACH' ? 1 : 2);
            const scoreA = getScore(sA);
            const scoreB = getScore(sB);
            
            if (scoreA !== scoreB) return scoreA - scoreB;
            return a.name.localeCompare(b.name);
          });

          const displayPlayers = filteredPlayers.slice(0, 100);

          const handleAddRule = () => {
            if (!newRuleSeason.trim()) {
              showToast("Vui lòng nhập tên mùa cần giới hạn!"); return;
            }
            const seasonName = newRuleSeason.trim();
            if (restrictedRules.some(r => r.season.toUpperCase() === seasonName.toUpperCase())) {
              showToast("Mùa này đã có trong danh sách giới hạn!"); return;
            }
            const updatedRules = [...restrictedRules, { season: seasonName, maxCount: parseInt(newRuleMax) || 1 }];
            setRestrictedRules(updatedRules);
            setNewRuleSeason('');
            setNewRuleMax(1);
            updateCloudState({ restrictedRules: updatedRules });
            showToast("Thêm quy định giới hạn thành công!", "success");
          };

          const handleRemoveRule = (seasonToRemove) => {
            const updatedRules = restrictedRules.filter(r => r.season !== seasonToRemove);
            setRestrictedRules(updatedRules);
            updateCloudState({ restrictedRules: updatedRules });
          };

          const handleImportBulk = () => {
            const lines = importText.split('\n');
            const newDb = [...database];
            let count = 0;
            lines.forEach((line) => {
              let parts = line.split('\t');
              if (parts.length < 3) parts = line.split('-').map(p => p.trim());
              if (parts.length >= 3) {
                const seasonVal = parts[2].trim();
                const p = {
                  id: Date.now() + Math.random(),
                  name: parts[0].trim(),
                  position: parts[1].trim(),
                  season: seasonVal,
                  isSkip: false
                };
                if (!newDb.some(existing => getPlayerKey(existing) === getPlayerKey(p))) {
                  newDb.push(p);
                  count++;
                }
              }
            });
            setDatabase(newDb);
            setImportText("");
            updateCloudState({ database: newDb });
            showToast(`Đã import thành công ${count} cầu thủ mới!`, "success");
          };

          const handleAddSingle = () => {
            if (!singlePlayer.name || !singlePlayer.position || !singlePlayer.season) {
              showToast("Vui lòng nhập đủ thông tin cầu thủ!"); return;
            }
            const p = {
              id: Date.now(),
              name: singlePlayer.name, position: singlePlayer.position, season: singlePlayer.season.trim(),
              isSkip: false
            };
            if (database.some(existing => getPlayerKey(existing) === getPlayerKey(p))) {
              showToast("Cầu thủ này đã tồn tại trong danh sách!"); return;
            }
            const updatedDb = [...database, p];
            setDatabase(updatedDb);
            setSinglePlayer({ name: '', position: '', season: '' });
            updateCloudState({ database: updatedDb });
            showToast("Thêm cầu thủ thành công!", "success");
          };

          const nextTurn = (rIdx, tIdx, pLeft, cList, pStartedFlag) => {
            const nextTurnIdx = tIdx + 1;
            if (nextTurnIdx < roundsConfig[rIdx].order.length) {
              const newState = {
                  currentRound: rIdx,
                  currentTurnIndex: nextTurnIdx,
                  picksLeftInTurn: roundsConfig[rIdx].picks,
                  coaches: cList,
                  pickStarted: pStartedFlag
              };
              setCurrentRound(rIdx);
              setCurrentTurnIndex(nextTurnIdx);
              setPicksLeftInTurn(roundsConfig[rIdx].picks);
              setCoaches(cList);
              updateCloudState(newState);
            } else {
              if (rIdx < 7) {
                const newState = {
                    currentRound: rIdx + 1,
                    currentTurnIndex: 0,
                    picksLeftInTurn: roundsConfig[rIdx + 1].picks,
                    coaches: cList,
                    pickStarted: pStartedFlag
                };
                setCurrentRound(rIdx + 1);
                setCurrentTurnIndex(0);
                setPicksLeftInTurn(roundsConfig[rIdx + 1].picks);
                setCoaches(cList);
                updateCloudState(newState);
              } else {
                const newState = {
                    pickStarted: false,
                    coaches: cList
                };
                setPickStarted(false);
                setCoaches(cList);
                updateCloudState(newState);
                showToast("Quá trình Pick Hoàn Tất!", "success");
              }
            }
          };

          const handlePick = (player) => {
            if (isViewer) return;

            const status = getPlayerStatus(player);
            if (status === 'PICKED_ANY') { 
                showToast(`Cầu thủ ${player.name} (${player.season}) đã bị pick trước đó!`, "error"); 
                return; 
            }
            if (status === 'SAME_NAME_CURRENT_COACH') { 
                showToast(`HLV ${activeCoach.name} đã có cầu thủ ${player.name} ở mùa thẻ khác!`, "error"); 
                return; 
            }
            
            const coachIndex = coaches.findIndex(c => c.id === currentCoachId);
            const coach = coaches[coachIndex];
            
            if (coach.squad && coach.squad.length >= 23) { showToast("Đội hình đã đủ 23 cấu trúc!", "error"); return; }

            for (let rule of restrictedRules) {
              if (player.season.trim().toLowerCase() === rule.season.toLowerCase()) {
                const currentCount = coach.squad ? coach.squad.filter(p => p.season.trim().toLowerCase() === rule.season.toLowerCase() && !p.isSkip).length : 0;
                if (currentCount >= rule.maxCount) {
                  showToast(`Đội hình không được quá ${rule.maxCount} cầu thủ mùa ${rule.season}!`, "error");
                  return;
                }
              }
            }

            const newCoaches = JSON.parse(JSON.stringify(coaches));
            if (!newCoaches[coachIndex].squad) newCoaches[coachIndex].squad = [];
            newCoaches[coachIndex].squad.push(player);

            const newPicksLeft = picksLeftInTurn - 1;
            if (newPicksLeft <= 0) {
              nextTurn(currentRound, currentTurnIndex, roundsConfig[currentRound].picks, newCoaches, pickStarted);
            } else {
              setCurrentRound(currentRound);
              setCurrentTurnIndex(currentTurnIndex);
              setPicksLeftInTurn(newPicksLeft);
              setCoaches(newCoaches);
              updateCloudState({
                  coaches: newCoaches,
                  picksLeftInTurn: newPicksLeft
              });
            }
            showToast(`Đã pick thành công ${player.name} (${player.season}) cho ${coach.name}!`, "success");
          };

          const handleSkip = () => {
            if (isViewer) return;

            const coachIndex = coaches.findIndex(c => c.id === currentCoachId);
            const coach = coaches[coachIndex];
            
            if (coach.squad && coach.squad.length >= 23) { showToast("Đội hình đã đủ 23 cấu trúc!", "error"); return; }

            const skipPlayer = {
              id: Date.now() + Math.random(),
              name: 'BỎ QUA LƯỢT',
              position: 'SKIP',
              season: '',
              isSkip: true
            };

            const newCoaches = JSON.parse(JSON.stringify(coaches));
            if (!newCoaches[coachIndex].squad) newCoaches[coachIndex].squad = [];
            newCoaches[coachIndex].squad.push(skipPlayer);

            const newPicksLeft = picksLeftInTurn - 1;
            if (newPicksLeft <= 0) {
              nextTurn(currentRound, currentTurnIndex, roundsConfig[currentRound].picks, newCoaches, pickStarted);
            } else {
              setCurrentRound(currentRound);
              setCurrentTurnIndex(currentTurnIndex);
              setPicksLeftInTurn(newPicksLeft);
              setCoaches(newCoaches);
              updateCloudState({
                  coaches: newCoaches,
                  picksLeftInTurn: newPicksLeft
              });
            }
            showToast(`Đã bỏ qua lượt pick của ${coach.name}`, "success");
          };

          const copyShareLink = () => {
              const currentUrl = window.location.origin + window.location.pathname + '?room=' + roomCode + '&role=viewer';
              navigator.clipboard.writeText(currentUrl);
              showToast("Đã copy link phòng Realtime cho các HLV (Chế độ chỉ xem)!", "success");
          };

          const exportToExcel = () => {
            const exportData = coaches.map(coach => {
              const pickedCount = coach.squad ? coach.squad.filter(p => !p.isSkip).length : 0;
              const skipCount = coach.squad ? coach.squad.filter(p => p.isSkip).length : 0;
              
              const coachData = { 
                  'Huấn luyện viên': coach.name, 
                  'Số lượt pick': pickedCount,
                  'Số lượt bỏ qua': skipCount,
                  'Tổng số slot': coach.squad ? coach.squad.length : 0
              };
              for (let i = 0; i < 23; i++) {
                const player = coach.squad && coach.squad[i] ? coach.squad[i] : null;
                coachData[`Cầu thủ ${i + 1}`] = player 
                    ? (player.isSkip ? 'BỎ QUA LƯỢT' : `${player.name} - ${player.position} - ${player.season}`) 
                    : '';
              }
              return coachData;
            });
            const worksheet = window.XLSX.utils.json_to_sheet(exportData);
            const workbook = window.XLSX.utils.book_new();
            window.XLSX.utils.book_append_sheet(workbook, worksheet, "Kết quả Pick");
            window.XLSX.writeFile(workbook, "Ket_Qua_Pick.xlsx");
          };

          // --- VIEWERS RENDERING LOGIC ---
          if (connectionError) {
              return (
                  <div className="min-h-screen flex flex-col items-center justify-center bg-[#070a14] text-white p-6 text-center">
                      <div className="text-red-500 text-6xl mb-4">⚠️</div>
                      <h2 className="text-2xl font-black text-red-400 mb-2">LỖI KẾT NỐI MÁY CHỦ</h2>
                      <p className="text-gray-400 max-w-xl">
                          Ứng dụng không thể kết nối tới cơ sở dữ liệu Firebase. 
                          Có thể URL mặc định bị lỗi hoặc bạn chưa cấu hình Database hợp lệ.
                      </p>
                      <p className="text-gray-500 mt-4 text-sm bg-gray-900 p-4 rounded-lg border border-gray-800">
                          <strong>Hướng dẫn sửa lỗi cho Host:</strong><br/>
                          1. Mở file HTML bằng Notepad hoặc VS Code.<br/>
                          2. Tìm dòng <code>databaseURL: "https://beapro-football-pick-default-rtdb.firebaseio.com/"</code><br/>
                          3. Thay thế bằng đường dẫn Firebase Realtime Database của riêng bạn (nhớ mở quyền Rules đọc/ghi thành true).
                      </p>
                  </div>
              )
          }

          if (!isSynced) {
              return (
                  <div className="min-h-screen flex flex-col items-center justify-center bg-[#070a14] text-white">
                      <div className="loader mb-4"></div>
                      <h2 className="text-xl font-bold text-blue-400">Đang kết nối Server...</h2>
                  </div>
              )
          }

          if (isViewer && !pickStarted) {
              return (
                  <div className="min-h-screen flex flex-col items-center justify-center bg-[#070a14] text-white p-6 text-center">
                      <div className="animate-spin text-6xl mb-6 opacity-80">⏳</div>
                      <h2 className="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-400 mb-3 tracking-widest uppercase">VUI LÒNG CHỜ...</h2>
                      <p className="text-gray-400 text-lg">Host đang thiết lập giải đấu. Giao diện Pick sẽ tự động hiện ra khi Host bấm Bắt đầu.</p>
                      <div className="mt-8 p-4 bg-gray-900 border border-gray-800 rounded-lg shadow-inner">
                          <span className="text-sm text-gray-500">Mã phòng: <strong className="text-blue-400">{roomCode}</strong></span>
                      </div>
                  </div>
              )
          }

          // --- MAIN HOST & VIEWER DASHBOARD RENDERING ---
          return (
            <div className="min-h-screen text-white p-6" style={{backgroundColor: '#070a14'}}>
              {toast && (
                <div className={`fixed top-5 right-5 z-50 px-6 py-3 rounded shadow-lg text-white font-bold transition-all ${toast.type === 'error' ? 'bg-red-600' : 'bg-green-600'}`}>
                  {toast.message}
                </div>
              )}

              <div className="max-w-7xl mx-auto">
                <div className="flex flex-col md:flex-row items-center justify-between gap-4 mb-6 border-b border-gray-800 pb-4">

                {/* STEP 1 TO 3 ARE ONLY FOR HOST */}
                {!isViewer && step === 1 && (
                  <div className="bg-gray-900/90 border border-gray-800 p-6 rounded-xl shadow-2xl backdrop-blur">
                    <h2 className="text-xl font-bold mb-4 text-blue-400 tracking-wide uppercase">BƯỚC 1: NHẬP TÊN CÁC HUẤN LUYỆN VIÊN</h2>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                      {coaches.map(c => (
                        <div key={c.id}>
                          <label className="text-xs text-gray-400 uppercase tracking-wider font-semibold">HLV {c.id}</label>
                          <input 
                            type="text" 
                            value={c.name} 
                            onChange={(e) => {
                                const newCoaches = coaches.map(coach => coach.id === c.id ? { ...coach, name: e.target.value } : coach);
                                setCoaches(newCoaches);
                                updateCloudState({ coaches: newCoaches });
                            }} 
                            className="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg mt-1 outline-none focus:ring-2 focus:ring-blue-500 font-bold" 
                          />
                        </div>
                      ))}
                    </div>

                    <div className="mt-8 flex justify-end">
                      <button onClick={() => { setStep(2); updateCloudState({ step: 2 }); }} className="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 px-6 py-2.5 rounded-lg font-bold tracking-wide shadow-lg transition-all cursor-pointer">Tiếp Tục ➔</button>
                    </div>
                  </div>
                )}

                {!isViewer && step === 2 && (
                  <div className="bg-gray-900/90 border border-gray-800 p-6 rounded-xl shadow-2xl backdrop-blur">
                    <h2 className="text-xl font-bold mb-2 text-blue-400 tracking-wide uppercase">BƯỚC 2: CÀI ĐẶT QUY ĐỊNH GIỚI HẠN MÙA THẺ</h2>
                    <p className="text-sm text-gray-400 mb-6">Hệ thống đã nạp sẵn các mùa thẻ mẫu (Legends, WCC, WC26, WCI, WK). Bạn có thể thêm, chỉnh sửa hoặc xóa tùy ý.</p>
                    
                    <div className="flex flex-col md:flex-row gap-4 mb-6 bg-gray-800/60 border border-gray-700/60 p-4 rounded-xl items-end">
                      <div className="flex-1 w-full">
                        <label className="text-xs text-gray-300 mb-1 block uppercase font-semibold">Tên Mùa Thẻ</label>
                        <input placeholder="VD: Legends, WCC, WC26..." value={newRuleSeason} onChange={e => setNewRuleSeason(e.target.value)} className="w-full bg-gray-900 border border-gray-700 p-2.5 rounded-lg outline-none font-bold" />
                      </div>
                      <div className="w-full md:w-36">
                        <label className="text-xs text-gray-300 mb-1 block uppercase font-semibold">Tối đa / đội</label>
                        <input type="number" min="1" max="23" value={newRuleMax} onChange={e => setNewRuleMax(e.target.value)} className="w-full bg-gray-900 border border-gray-700 p-2.5 rounded-lg outline-none font-bold" />
                      </div>
                      <button onClick={handleAddRule} className="w-full md:w-auto bg-green-600 hover:bg-green-500 px-6 py-2.5 rounded-lg font-bold transition-all h-[42px] cursor-pointer">Thêm Quy Định</button>
                    </div>

                    <div className="space-y-2 mb-8">
                      <h3 className="font-bold text-sm text-gray-300 uppercase tracking-wide">Danh sách giới hạn đang áp dụng:</h3>
                      {restrictedRules.map((rule, idx) => (
                        <div key={idx} className="flex justify-between items-center bg-gray-800/80 border border-gray-700 p-3.5 rounded-xl">
                          <span>Mùa thẻ: <strong className="text-yellow-400 font-extrabold">{rule.season}</strong> — Tối đa: <strong className="text-yellow-400 font-extrabold">{rule.maxCount} cầu thủ/đội</strong></span>
                          <button onClick={() => handleRemoveRule(rule.season)} className="bg-red-600/80 hover:bg-red-500 px-4 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer">Xóa</button>
                        </div>
                      ))}
                      {restrictedRules.length === 0 && <p className="text-sm text-gray-500 italic">Chưa có quy định giới hạn nào được thiết lập.</p>}
                    </div>

                    <div className="flex justify-between">
                      <button onClick={() => { setStep(1); updateCloudState({ step: 1 }); }} className="bg-gray-800 hover:bg-gray-700 px-6 py-2.5 rounded-lg font-bold transition-all cursor-pointer border border-gray-700">⬅ Quay Lại</button>
                      <button onClick={() => { setStep(3); updateCloudState({ step: 3 }); }} className="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 px-6 py-2.5 rounded-lg font-bold transition-all cursor-pointer">Tiếp Tục ➔</button>
                    </div>
                  </div>
                )}

                {!isViewer && step === 3 && (
                  <div className="bg-gray-900/90 border border-gray-800 p-6 rounded-xl shadow-2xl backdrop-blur">
                    <h2 className="text-xl font-bold mb-4 text-blue-400 tracking-wide uppercase">BƯỚC 3: NẠP DỮ LIỆU CẦU THỦ</h2>
                    <div className="grid md:grid-cols-2 gap-8">
                      <div className="bg-gray-800/60 border border-gray-700/60 p-5 rounded-xl">
                        <h3 className="font-bold mb-3 text-indigo-300 uppercase text-sm">Thêm thủ công</h3>
                        <input placeholder="Tên cầu thủ (VD: Ronaldo)" value={singlePlayer.name} onChange={e=>setSinglePlayer({...singlePlayer, name: e.target.value})} className="w-full mb-3 bg-gray-900 border border-gray-700 p-2.5 rounded-lg outline-none font-bold text-sm" />
                        <input placeholder="Vị trí (VD: ST)" value={singlePlayer.position} onChange={e=>setSinglePlayer({...singlePlayer, position: e.target.value})} className="w-full mb-3 bg-gray-900 border border-gray-700 p-2.5 rounded-lg outline-none font-bold text-sm" />
                        <input placeholder="Mùa thẻ (VD: Legends)" value={singlePlayer.season} onChange={e=>setSinglePlayer({...singlePlayer, season: e.target.value})} className="w-full mb-3 bg-gray-900 border border-gray-700 p-2.5 rounded-lg outline-none font-bold text-sm" />
                        <button onClick={handleAddSingle} className="w-full bg-green-600 hover:bg-green-500 py-2.5 rounded-lg font-bold transition-all text-sm cursor-pointer shadow-md">Thêm Cầu Thủ</button>
                      </div>
                      <div className="bg-gray-800/60 border border-gray-700/60 p-5 rounded-xl flex flex-col justify-between">
                        <div>
                          <h3 className="font-bold mb-1 text-indigo-300 uppercase text-sm">Thêm hàng loạt (Copy Paste)</h3>
                          <p className="text-xs text-gray-400 mb-3 font-medium">Cú pháp: Tên - Vị trí - Mùa thẻ</p>
                          <textarea rows="4" value={importText} onChange={e=>setImportText(e.target.value)} className="w-full mb-3 bg-gray-900 border border-gray-700 p-2.5 rounded-lg outline-none font-mono text-xs" placeholder="Messi - RW - WCC
Ronaldo - ST - Legends"></textarea>
                        </div>
                        <button onClick={handleImportBulk} className="w-full bg-green-600 hover:bg-green-500 py-2.5 rounded-lg font-bold transition-all text-sm cursor-pointer shadow-md">Import Danh Sách</button>
                      </div>
                    </div>
                    <div className="mt-6 p-3.5 bg-gray-800/80 border border-gray-700 rounded-xl text-center">Tổng số cầu thủ trong Data: <strong className="text-yellow-400 text-xl font-black">{database.length}</strong></div>
                    <div className="mt-8 flex justify-between">
                      <button onClick={() => { setStep(2); updateCloudState({ step: 2 }); }} className="bg-gray-800 hover:bg-gray-700 px-6 py-2.5 rounded-lg font-bold transition-all cursor-pointer border border-gray-700">⬅ Quay Lại</button>
                      <button onClick={() => { if(database.length < 23) { showToast("Cần ít nhất 23 cầu thủ để pick!"); return; } setStep(4); updateCloudState({ step: 4 }); }} className="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 px-6 py-2.5 rounded-lg font-bold transition-all cursor-pointer">Vào Phòng Pick ➔</button>
                    </div>
                  </div>
                )}

                {/* DASHBOARD - RENDER FOR BOTH HOST AND VIEWER (IF VIEWER AND PICKSTARTED) */}
                {(step === 4 || (isViewer && pickStarted)) && (
                  <div className="grid lg:grid-cols-4 gap-6">
                    <div className="lg:col-span-1 bg-gray-900/90 border border-gray-800 p-4 rounded-xl shadow-2xl flex flex-col h-[88vh] backdrop-blur">
                      <div className="mb-4 text-center">
                        {!isViewer && (
                            <button onClick={exportToExcel} className="w-full bg-gradient-to-r from-emerald-600 to-green-600 hover:from-emerald-500 hover:to-green-500 text-white py-2.5 rounded-lg font-extrabold shadow-lg mb-4 transition-all cursor-pointer tracking-wide text-sm flex items-center justify-center gap-2">
                            <span>⬇</span> Xuất file Excel
                            </button>
                        )}
                        <h2 className="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-400 mb-3 uppercase tracking-wider">ĐỢT {currentRound + 1} / 8</h2>
                        
                        {!pickStarted ? (
                          <div className="flex gap-2">
                            {!isViewer && (
                                <button onClick={() => { setPickStarted(true); updateCloudState({ pickStarted: true }); }} className="flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 py-2.5 rounded-lg font-extrabold text-sm shadow-md transition-all cursor-pointer">Bắt đầu Pick</button>
                            )}
                          </div>
                        ) : (
                          <div className="bg-gray-800/90 border border-blue-500/50 p-3 rounded-xl shadow-inner flex flex-col items-center">
                            <p className="text-xs text-gray-400 font-semibold uppercase tracking-wider">Đang chọn:</p>
                            <p className="text-lg font-black text-blue-300 my-0.5 tracking-wide">{activeCoach?.name}</p>
                            <p className="text-xs mb-3 text-gray-300">Lượt pick thứ: <span className="text-yellow-400 font-extrabold">{roundsConfig[currentRound].picks - picksLeftInTurn + 1} / {roundsConfig[currentRound].picks}</span></p>
                            
                            {!isViewer && (
                                <div className="flex gap-2 w-full">
                                <button 
                                    onClick={handleSkip} 
                                    className="flex-1 bg-red-700/90 hover:bg-red-600 text-white font-extrabold py-2 px-2 rounded-lg shadow-md transition-colors text-xs flex items-center justify-center gap-1 cursor-pointer tracking-wide"
                                >
                                    ⏭️ Bỏ Qua
                                </button>
                                </div>
                            )}
                          </div>
                        )}
                      </div>
                      <div className="flex-1 overflow-hidden flex flex-col">
                        <div className="flex gap-2 mb-3">
                          <input 
                            type="text" 
                            placeholder="🔍 Tìm tên, vị trí..." 
                            value={searchQuery} 
                            onChange={(e) => setSearchQuery(e.target.value)} 
                            className="w-3/5 bg-gray-800 border border-gray-700 p-2 rounded-lg outline-none text-xs font-bold" 
                          />
                          <select 
                            value={seasonFilter} 
                            onChange={(e) => setSeasonFilter(e.target.value)}
                            className="w-2/5 bg-gray-800 border border-gray-700 p-2 rounded-lg outline-none cursor-pointer text-xs font-bold text-yellow-400"
                          >
                            <option value="">Tất cả mùa</option>
                            {availableSeasons.map((season, idx) => (
                              <option key={idx} value={season}>{season}</option>
                            ))}
                          </select>
                        </div>
                        
                        <div className="overflow-y-auto flex-1 space-y-2 pr-1">
                          {displayPlayers.map(p => {
                            const status = getPlayerStatus(p);
                            
                            let bgClass = "bg-gray-800/80 hover:bg-gray-800";
                            let borderClass = "border-gray-700/80 hover:border-gray-600";
                            let textClass = "text-white font-bold";
                            let subTextClass = "text-gray-400 text-[11px]";
                            let btnClass = "bg-blue-600 hover:bg-blue-500 text-white cursor-pointer shadow-md";
                            let btnText = "Chọn";
                            let isDisabled = !pickStarted;

                            if (status === 'PICKED_ANY') {
                              bgClass = "bg-red-950/60 border-red-900/60 opacity-60";
                              borderClass = "border-red-900";
                              textClass = "text-red-300 line-through font-bold";
                              subTextClass = "text-red-400/80 text-[11px]";
                              btnClass = "bg-red-900/80 text-gray-400 cursor-not-allowed";
                              btnText = "Đã Chọn";
                              isDisabled = true;
                            } else if (status === 'SAME_NAME_CURRENT_COACH') {
                              bgClass = "bg-yellow-950/60 border-yellow-900/60 opacity-75";
                              borderClass = "border-yellow-950";
                              textClass = "text-yellow-200 font-bold";
                              subTextClass = "text-yellow-400/80 text-[11px]";
                              btnClass = "bg-yellow-800/80 text-gray-200 cursor-not-allowed";
                              btnText = "Trùng Tên";
                              isDisabled = true;
                            }

                            return (
                              <div key={p.id} className={`p-2.5 rounded-xl flex justify-between items-center border transition-colors ${bgClass} ${borderClass}`}>
                                <div className="truncate pr-2">
                                  <p className={`text-xs ${textClass} truncate`}>
                                    {p.name} 
                                    {status === 'PICKED_ANY' && <span className="text-red-400 text-[10px] ml-1 font-normal">(Đã pick)</span>}
                                    {status === 'SAME_NAME_CURRENT_COACH' && <span className="text-yellow-400 text-[10px] ml-1 font-normal">(Trùng tên)</span>}
                                  </p>
                                  <p className={`font-semibold ${subTextClass}`}>{p.position} | <span className="text-indigo-300 font-bold">{p.season}</span></p>
                                </div>
                                
                                {!isViewer ? (
                                    <button 
                                    onClick={() => handlePick(p)} 
                                    disabled={isDisabled} 
                                    className={`${btnClass} px-3 py-1 rounded-lg text-xs font-black tracking-wide disabled:opacity-40 transition-all shrink-0`}
                                    >
                                    {btnText}
                                    </button>
                                ) : (
                                    status !== 'AVAILABLE' && (
                                        <span className="text-[10px] uppercase font-bold text-gray-400 bg-gray-900 px-2 py-1 rounded">{btnText}</span>
                                    )
                                )}
                              </div>
                            );
                          })}
                          {filteredPlayers.length === 0 && <p className="text-center text-gray-500 text-xs mt-6 italic">Không tìm thấy cầu thủ</p>}
                          {filteredPlayers.length > 100 && <p className="text-center text-gray-400 text-[10px] mt-4 mb-2">Đang hiển thị 100 / {filteredPlayers.length} cầu thủ.<br/>Hãy gõ tên để tìm kiếm thêm.</p>}
                        </div>
                      </div>
                    </div>
                    <div className="lg:col-span-3 grid grid-cols-2 lg:grid-cols-4 gap-4 h-fit">
                      {coaches.map(coach => {
                        const pickedCount = coach.squad ? coach.squad.filter(p => !p.isSkip).length : 0;
                        const skipCount = coach.squad ? coach.squad.filter(p => p.isSkip).length : 0;
                        
                        return (
                          <div key={coach.id} className={`bg-gray-900/90 border p-3.5 rounded-xl shadow-xl backdrop-blur ${getActiveCoachId() === coach.id && pickStarted ? 'border-blue-500 shadow-[0_0_20px_rgba(59,130,246,0.3)] bg-gray-900' : 'border-gray-800'}`}>
                            <h3 className="font-black text-base text-center text-blue-300 truncate tracking-wide uppercase">{coach.name}</h3>
                            
                            <div className="bg-gray-800/90 border border-gray-700/80 text-[11px] p-2 rounded-lg my-2 text-center space-y-0.5 shadow-inner">
                              <div className="text-yellow-400 font-extrabold">Số lượt pick: {pickedCount} cầu thủ</div>
                              <div className="text-red-400 font-extrabold">Số lượt bỏ qua: {skipCount} lần</div>
                            </div>

                            <div className="flex flex-wrap gap-1 text-[10px] text-gray-300 bg-gray-800/50 border border-gray-700/50 p-1.5 rounded-lg mb-2 justify-between">
                              {restrictedRules.map((rule, rIdx) => {
                                const currentCount = coach.squad ? coach.squad.filter(p => p.season.trim().toUpperCase() === rule.season.toUpperCase() && !p.isSkip).length : 0;
                                const isOver = currentCount >= rule.maxCount;
                                return (
                                  <span key={rIdx} className="font-semibold">{rule.season}: <strong className={isOver ? 'text-red-400 font-black' : 'text-white font-extrabold'}>{currentCount}/{rule.maxCount}</strong></span>
                                );
                              })}
                            </div>

                            <div className="bg-gray-950/80 border border-gray-900 rounded-xl p-2 h-[410px] overflow-y-auto space-y-1">
                              {coach.squad && coach.squad.map((p, idx) => (
                                <div key={idx} className={`${p.isSkip ? 'bg-red-950/80 border-red-600 text-red-200' : 'bg-gray-800/90 border-blue-500 text-gray-100'} p-2 rounded-lg text-xs border-l-2 flex justify-between items-center shadow-sm`}>
                                  <span className={`truncate pr-1 font-bold ${p.isSkip ? 'text-red-300 tracking-wider' : ''}`}>{idx + 1}. {p.name}</span>
                                  <span className={`text-[10px] whitespace-nowrap px-1.5 py-0.5 rounded font-extrabold ${p.isSkip ? 'bg-red-900 text-white' : 'bg-gray-700 text-indigo-300'}`}>
                                    {p.isSkip ? 'SKIP' : `${p.position}-${p.season}`}
                                  </span>
                                </div>
                              ))}
                              {(!coach.squad || coach.squad.length === 0) && <p className="text-xs text-center text-gray-600 mt-20 italic">Chưa có cầu thủ</p>}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PickApp />);
    </script>
</body>
</html>
